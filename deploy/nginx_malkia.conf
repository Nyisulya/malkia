# ========================================================
# MALKIA CARGO WAVE LIMITED — NGINX CONFIGURATION
# Domains:
#   1. portal.malkiacargowave.com  --> Gunicorn Port 3444
#   2. malkiacargowave.com         --> Public Website
# ========================================================

# 1. OPERATIONS PORTAL (portal.malkiacargowave.com)
server {
    listen 80;
    server_name portal.malkiacargowave.com;
    client_max_body_size 60M;

    # Static Assets for Portal
    location /static/ {
        alias /var/www/malkia/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media / Uploaded Documents (Bill of Lading, Receipts, PODs)
    location /media/ {
        alias /var/www/malkia/media/;
        expires 7d;
    }

    # Proxy to Django Gunicorn running on PORT 3444
    location / {
        proxy_pass http://127.0.0.1:3444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}

# 2. PUBLIC CORPORATE WEBSITE (malkiacargowave.com)
server {
    listen 80;
    server_name malkiacargowave.com www.malkiacargowave.com;

    root /var/www/malkia/website;
    index index.html;

    # Fast Static Website Caching
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
    }

    # AI Chat Assistant Endpoint (Routed to Django on Port 3444)
    location /api/website-ai/chat/ {
        proxy_pass http://127.0.0.1:3444/api/website-ai/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# =========================================================================
# MALKIA CARGO WAVE LIMITED - UNIFIED NGINX CONFIGURATION
# Port: 3444 (Single Unified Django System for both Website & Portal)
# Domains:
#   1. malkiacargowave.com, www.malkiacargowave.com (Corporate Website)
#   2. portal.malkiacargowave.com (Operations Portal)
# =========================================================================

server {
    listen 80;
    server_name malkiacargowave.com www.malkiacargowave.com portal.malkiacargowave.com;
    client_max_body_size 60M;

    # Static Assets (CSS, JS, Fonts, Images)
    location /static/ {
        alias /www/wwwroot/malkia/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded Documents (Bill of Lading, Receipts, PODs)
    location /media/ {
        alias /www/wwwroot/malkia/media/;
        expires 7d;
    }

    # Proxy everything to Django on Port 3444
    # (Django smart router automatically serves the Website or the Portal based on the incoming domain)
    location / {
        proxy_pass http://127.0.0.1:3444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}

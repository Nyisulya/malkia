<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBS Authorization Letter - {{ job.job_number }} | Malkia Cargo Wave Limited</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        {% include "core/includes/authorization_letter_styles.html" %}
        .btn-print { background: #2563EB; }
        .btn-print:hover { background: #1D4ED8; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div>
            <strong style="font-size:0.95rem;">
                <i class="fa-solid fa-file-contract" style="color:#2563EB;margin-right:0.35rem;"></i>
                TBS Authorization Letter
            </strong>
            <span style="margin-left:0.75rem;font-size:0.82rem;color:#94A3B8;">
                BL: {{ job.bl_number|default:"—" }} | Job: {{ job.job_number }} | {{ job.customer.company_name }}
            </span>
        </div>
        <div style="display:flex;gap:0.5rem;align-items:center;">
            <div style="display:flex;align-items:center;gap:0.35rem;font-size:0.78rem;background:#1E293B;padding:0.25rem 0.55rem;border-radius:6px;border:1px solid #334155;">
                <span style="color:#94A3B8;"><i class="fa-solid fa-arrows-up-down"></i> Nafasi ya Logo:</span>
                <button type="button" onclick="setLetterheadTop('28mm')" class="spacing-btn" id="sp28" title="28mm (Karatasi yenye Logo Fupi)">Fupi</button>
                <button type="button" onclick="setLetterheadTop('38mm')" class="spacing-btn active" id="sp38" title="38mm (Kawaida)">Kawaida</button>
                <button type="button" onclick="setLetterheadTop('48mm')" class="spacing-btn" id="sp48" title="48mm (Karatasi yenye Logo Ndefu)">Ndefu</button>
            </div>
            <a href="{% url 'job_detail' job.id %}" class="btn btn-back">
                <i class="fa-solid fa-arrow-left"></i> Back to File
            </a>
            <a href="{% url 'print_letters_pack' job.id %}" class="btn btn-sub">
                <i class="fa-solid fa-layer-group"></i> Print Both (TRA + TBS)
            </a>
            <button onclick="window.print()" class="btn btn-print">
                <i class="fa-solid fa-print"></i> Print TBS Letter (1 Page)
            </button>
        </div>
    </div>

    {% include "core/includes/authorization_letter_page.html" with letter_type="TBS" %}

    <script>
        function setLetterheadTop(val) {
            document.documentElement.style.setProperty('--letterhead-top', val);
            document.querySelectorAll('.spacing-btn').forEach(b => b.classList.remove('active'));
            if (val === '28mm') document.getElementById('sp28')?.classList.add('active');
            if (val === '38mm') document.getElementById('sp38')?.classList.add('active');
            if (val === '48mm') document.getElementById('sp48')?.classList.add('active');
        }
    </script>
</body>
</html>

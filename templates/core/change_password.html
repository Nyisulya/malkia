{% extends 'base.html' %}
{% block title %}Change Password — Malkia Cargo Waves{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom:1.25rem;">
    <div>
        <h1 class="page-title"><i class="fa-solid fa-key" style="color:var(--brand-primary);"></i> Change My Password</h1>
        <p class="page-subtitle">Update your account password to a personal password of your choice.</p>
    </div>
</div>

<div class="card-panel" style="max-width:520px;padding:1.5rem;">
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:1rem;">
            <label style="display:block;font-size:0.82rem;font-weight:700;color:#334155;margin-bottom:0.35rem;">Current Password</label>
            <input type="password" name="current_password" required class="form-control" style="width:100%;padding:0.65rem 0.85rem;border:1px solid #CBD5E1;border-radius:8px;">
        </div>
        <div style="margin-bottom:1rem;">
            <label style="display:block;font-size:0.82rem;font-weight:700;color:#334155;margin-bottom:0.35rem;">New Password (at least 6 characters)</label>
            <input type="password" name="new_password" required minlength="6" class="form-control" style="width:100%;padding:0.65rem 0.85rem;border:1px solid #CBD5E1;border-radius:8px;">
        </div>
        <div style="margin-bottom:1.25rem;">
            <label style="display:block;font-size:0.82rem;font-weight:700;color:#334155;margin-bottom:0.35rem;">Confirm New Password</label>
            <input type="password" name="confirm_password" required minlength="6" class="form-control" style="width:100%;padding:0.65rem 0.85rem;border:1px solid #CBD5E1;border-radius:8px;">
        </div>
        <div style="display:flex;gap:0.75rem;align-items:center;">
            <button type="submit" class="btn-header-action btn-primary" style="padding:0.6rem 1.25rem;border:none;border-radius:8px;font-weight:800;">
                <i class="fa-solid fa-check"></i> Save New Password
            </button>
            <a href="{% url 'dashboard' %}" class="btn-header-action btn-outline" style="padding:0.6rem 1rem;border-radius:8px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
